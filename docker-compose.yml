# TaskTrackerServer — Docker Compose
#
# Deployment profiles (run one at a time):
#
#   Postgres (shared, multi-user):
#     docker compose --profile postgres up -d
#
#   SQLite (single-node, zero external dependencies):
#     docker compose --profile sqlite up -d
#
#   Expose (no host publish, for a tunnelling sidecar):
#     docker compose --profile expose up -d
#
#   Cloudflare Tunnel (requires cloudflared sidecar, configured by `tt expose`):
#     See `tt expose --provider=cloudflare --domain <your-domain>`
#
# The server binds 0.0.0.0 *inside* the container; the published side is
# loopback, so plain HTTP is not reachable from the network. A reverse proxy on
# the host reaches it at 127.0.0.1:${SERVER_PORT}.
#
# JWT_SECRET is required for every profile. Generate one:
#   openssl rand -hex 32
#
# Pass it via environment variable or a .env file next to this compose file:
#   JWT_SECRET=<your-secret>
#   POSTGRES_PASSWORD=<change-me>   # only for the postgres profile
#   CLOUDFLARE_TUNNEL_TOKEN=<token>  # only for cloudflare tunnel

x-postgres: &postgres
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: tasktracker
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasktracker}
    POSTGRES_DB: tasktracker
  volumes:
    - pg-data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U tasktracker"]
    interval: 5s
    timeout: 5s
    retries: 5
  restart: unless-stopped

x-server-pg: &server-pg
  build: .
  environment:
    SERVER_BIND: "0.0.0.0"
    SERVER_PORT: "8080"
    DATABASE_URL: "postgres://tasktracker:${POSTGRES_PASSWORD:-tasktracker}@postgres:5432/tasktracker"
    JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
    JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-1h}"
    JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-720h}"
    CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}"
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  # Blob bytes live under /data (the image sets ATTACHMENT_ROOT=/data/blobstore).
  # Without a named volume here they land in a container-scoped anonymous one and
  # vanish when the container is recreated, while Postgres keeps the metadata.
  volumes:
    - blob-data:/data
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  restart: unless-stopped

# Cloudflare Tunnel sidecar (configured by `tt expose --provider=cloudflare`).
# This is a reference; `tt` generates the full compose with the tunnel token.
x-cloudflared: &cloudflared
  image: cloudflare/cloudflared:latest
  command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  environment:
    TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
  depends_on:
    - server-pg
  restart: unless-stopped
  profiles: ["cloudflare"]

services:
  # ── Postgres profile ──────────────────────────────────────────────
  postgres:
    <<: *postgres
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  server-pg:
    <<: *server-pg
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  # ── Expose profile ────────────────────────────────────────────────
  # No host publishes at all: a sidecar in this profile reaches the server as
  # http://server-pg:8080 over the compose network. The database shares
  # pg-data, so switching between this profile and `postgres` keeps the data.
  postgres-expose:
    <<: *postgres
    profiles: ["expose"]
    networks:
      default:
        # Keeps the server's DATABASE_URL hostname unchanged across profiles.
        aliases:
          - postgres

  server-pg-expose:
    <<: *server-pg
    profiles: ["expose"]
    depends_on:
      postgres-expose:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - server-pg

  # ── SQLite profile ────────────────────────────────────────────────
  server-sqlite:
    profiles: ["sqlite"]
    build: .
    environment:
      SERVER_BIND: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_URL: "sqlite:///data/tasktracker.db"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-1h}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-720h}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Cloudflare Tunnel profile ────────────────────────────────────────
  # Configured by `tt expose --provider=cloudflare --domain <your-domain>`.
  # The tunnel token is passed via CLOUDFLARE_TUNNEL_TOKEN.
  cloudflare-postgres:
    <<: *postgres
    profiles: ["cloudflare"]
    networks:
      default:
        aliases:
          - postgres

  server-pg-cloudflare:
    <<: *server-pg
    profiles: ["cloudflare"]
    depends_on:
      cloudflare-postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - server-pg

  cloudflared:
    <<: *cloudflared
    profiles: ["cloudflare"]

volumes:
  pg-data:
  blob-data:
  sqlite-data:
