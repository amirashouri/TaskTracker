name: release

# Runs only on tag push (v*) or a dispatch that names a tag — not on every push
# to main. A tag publishes two artifacts, in order: the ghcr image a Docker
# install pulls, then the GitHub Release with the tt + server tarball the curl
# one-liner fetches. The image runs first so a release never advertises an image
# that does not exist.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish the server image
    runs-on: ubuntu-latest
    # A dispatch from a branch has no tag to name the image after. Checkout and
    # every tag below come from the ref, so `gh workflow run release.yml
    # --ref v1.2.3` works and a branch ref does nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase and repository_owner keeps its casing.
      - name: Compute the image reference
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/$owner/tasktracker-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures are released so Docker Desktop on Apple Silicon and
      # Windows, and arm64 Linux hosts, pull a native image. The server is
      # CGO/SQLite, so arm64 is compiled under QEMU on the amd64 runner.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
          cache-from: type=gha,scope=tasktracker-server-image
          cache-to: type=gha,mode=max,scope=tasktracker-server-image

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> "$GITHUB_OUTPUT"
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
            echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI release asset
        run: make release-tt VERSION="$GITHUB_REF_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TaskTracker Server ${{ github.ref_name }}
          # Every asset here is an install URL in README.md or docs/INSTALL.md;
          # the names are part of the documented contract, so do not rename one.
          # release-tt depends on release, so all six tt binaries exist by now.
          files: |
            dist/tt-linux-amd64.tar.gz
            dist/tt-linux-amd64
            dist/tt-linux-arm64
            dist/tt-darwin-amd64
            dist/tt-darwin-arm64
            dist/tt-windows-amd64.exe
            dist/tt-windows-arm64.exe
          body: |
            ## TaskTracker Server ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            Download the `tt` CLI for your machine, then run `tt install`:

            | Machine | Asset |
            | :--- | :--- |
            | Linux amd64 (bundle with `server`) | `tt-linux-amd64.tar.gz` |
            | Linux arm64 | `tt-linux-arm64` |
            | macOS Apple Silicon | `tt-darwin-arm64` |
            | macOS Intel | `tt-darwin-amd64` |
            | Windows amd64 | `tt-windows-amd64.exe` |
            | Windows arm64 | `tt-windows-arm64.exe` |

            See [docs/INSTALL.md](https://github.com/amirashouri/TaskTracker/blob/main/docs/INSTALL.md) for the per-platform commands and installation instructions.

            ### Server Binary

            The server is distributed as a Docker image:
            ```bash
            docker pull ghcr.io/amirashouri/tasktracker-server:${{ github.ref_name }}
            ```

            ### Client Compatibility

            Works with TaskTracker client at the same version tag.
            See [TaskTracker client releases](https://github.com/amirashouri/TaskTrackerKMP/releases/tag/${{ github.ref_name }}).

            ### License

            MIT + Commons Clause, plus one extra term: no rebranding. You can run this server in your own team, including in production; you may not sell it or repackage it under your own name and brand. The code stays the author's.
            Full text: [LICENSE](https://github.com/amirashouri/TaskTracker/blob/main/LICENSE).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
