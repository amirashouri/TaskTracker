# Simple CI pipeline: lint (format + vet), build, test, and a tagged CLI release.
#
# The tree is green on main, so a red pipeline is a real regression. Known
# runtime gaps (which still build and pass) are tracked in docs/PLAN.md.

stages:
  - lint
  - build
  - test
  - release

default:
  image: golang:1.27
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .gocache/

variables:
  # mattn/go-sqlite3 is cgo, and go.mod/go.sum must already be tidy.
  CGO_ENABLED: "1"
  GOFLAGS: "-mod=readonly"

before_script:
  - export GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache/build"

lint:
  stage: lint
  script:
    - test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
    - go vet ./...

build:
  stage: build
  script:
    - go build ./...

# The primary suite, with the race detector on. The sync engine, the rate
# limiter, and refresh-token rotation are all concurrent, and a data race there
# is a correctness bug a plain run cannot see. -race requires -covermode=atomic.
#
# Coverage is reported as a trend, not enforced: a threshold would either be
# too low to mean anything or would block a legitimate change, and the useful
# signal is the direction of the number across MRs.
test:
  stage: test
  script:
    - go test -race -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.out

# The same suite against Postgres; internal/dbtest gives each test its own schema.
# Deliberately without -race: this job exists to prove dialect parity, and the
# concurrency the race detector guards lives in Go code the job above already
# exercises. Adding it here would roughly double the pipeline for no new signal.
test-postgres:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: tasktracker_test
    TASKTRACKER_TEST_POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/tasktracker_test?sslmode=disable"
  script:
    - go test ./...

# The CLI is the install funnel. Build it on tags for every platform the
# customer might download it on, with the release tag baked into the image
# tag it pins.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - make release VERSION="$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
